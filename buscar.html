</head><body><header><b>FRANJA MORADA · FCM UNLP</b><nav><a href="index.html">Inicio</a><a href="ingreso-2027.html">Ingreso</a><a href="planes-estudio.html">Planes</a><a href="biblioteca.html">Biblioteca</a><a href="mapas.html">Mapas</a></nav></header><section class="hero"><h1>BUSCAR</h1><p>Encontrá rápidamente recursos y secciones del sitio.</p></section><main class="wrap"><input id="q" placeholder="Buscar: ingreso, anatomía, biblioteca, mapas..." autocomplete="off"><div class="grid" id="results"></div></main><footer>Franja Morada · Ciencias Médicas UNLP</footer><script>const data=[["Ingreso 2027","Inscripción, documentación, fechas, carreras y preguntas frecuentes.","ingreso-2027.html"],["Planes de estudio","Medicina, Enfermería, Nutrición, Obstetricia y TPC.","planes-estudio.html"],["Biblioteca","Biblioteca Islas Malvinas, préstamo, salas y recursos.","biblioteca.html"],["Mapas FCM","Sedes, ubicaciones y accesos.","mapas.html"],["Recursos","Cuadernillos, servicios y herramientas para estudiantes.","recursos.html"],["Agenda","Actividades, fechas y novedades.","agenda.html"],["Contacto","Canales de contacto y consultas.","contacto.html"]];const box=document.getElementById("results"),q=document.getElementById("q");function render(){const term=q.value.toLowerCase().trim();const rows=data.filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(term));box.innerHTML=rows.map(x=>'<article class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p><a href="'+x[2]+'">Abrir sección →</a></article>').join("")||'<p>No encontramos resultados.</p>'}q.addEventListener("input",render);render();</script></body></html>
